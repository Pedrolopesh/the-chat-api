# thechat-api.pedrolopes.tech → API do The Chat (porta local 3004).
# Inclui o upgrade de WebSocket do socket.io. Certificado: Let's Encrypt
# (certbot --webroot), mesmo esquema dos outros domínios da VPS.
# Ajuste UPSTREAM se o proxy rodar dentro do Docker (172.17.0.1:3004).
server {
    listen 80;
    server_name thechat-api.pedrolopes.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name thechat-api.pedrolopes.tech;

    ssl_certificate     /etc/letsencrypt/live/thechat-api.pedrolopes.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thechat-api.pedrolopes.tech/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
